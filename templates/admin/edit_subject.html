<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background: #05161a; color: #fff; }
        .container {
            margin-top: 50px;
            max-width: 600px;
            background: #072e33;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        h2 { color: #0f969c; }
        .btn-custom { background-color: #28a790; border: none; }
        .btn-custom:hover { background-color: #196241; }
        .btn-secondary:hover { background-color: #691e1e; }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="text-center">Edit Subject</h2>

        <div class="card p-4 shadow">
            <form action="{{ url_for('edit_subject', subject_id=subject.id) }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Subject Name:</label>
                    <input type="text" class="form-control" name="subject_name" value="{{ subject.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description:</label>
                    <textarea class="form-control" name="description" rows="3" required>{{ subject.description }}</textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-custom">Update</button>
                    <a href="{{ url_for('subject_management') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
