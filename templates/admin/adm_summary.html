<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #05161a;
            color: #fff;
        }

        /* Navbar styling */
        nav {
            background: #072e33;
            padding: 10px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f969c;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        nav ul li {
            margin-right: 20px;
        }

        nav ul li a {
            color: #0f969c;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #0b5a5e;
            text-decoration: underline;
        }

        nav span {
            color: #ccc;
        }

        /* Container styling */
        .container {
            max-width: 800px;
            background: #072e33;
            padding: 20px;
            margin: 40px auto;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        h2 {
            color: #0f969c;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Chart container styling */
        .chart-container {
            width: 100%;
            margin-bottom: 30px;
            background: #0f2a30;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        canvas {
            background: #0f2a30;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="{{ url_for('admin_dashboard') }}">Home</a></li>
            <li><a href="{{ url_for('quiz_management') }}">Quiz</a></li>
            <li><a href="{{ url_for('admin_summary') }}">Summary</a></li>
            <li><a href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
        <span>Welcome Admin</span>
    </nav>

    <div class="container">
        <h2>Summary Charts</h2>

        <div class="chart-container">
            <canvas id="scoreChart"></canvas>
        </div>

        <div class="chart-container">
            <canvas id="attemptsChart"></canvas>
        </div>
    </div>

    <script>
        // Sample data for Subject-wise Top Scores
        var ctx1 = document.getElementById('scoreChart').getContext('2d');
        var scoreChart = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: ['Maths', 'Physics', 'Chemistry'],
                datasets: [{
                    label: 'Top Scores',
                    data: [70, 90, 80],
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Sample data for Subject-wise User Attempts
        var ctx2 = document.getElementById('attemptsChart').getContext('2d');
        var attemptsChart = new Chart(ctx2, {
            type: 'doughnut',
            data: {
                labels: ['Maths', 'Physics', 'Chemistry'],
                datasets: [{
                    label: 'User Attempts',
                    data: [50, 30, 40],
                    backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56']
                }]
            },
            options: {
                responsive: true
            }
        });
    </script>

</body>
</html>
