<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #05161a;
            color: #fff;
        }

        /* Navbar styling */
        .navbar {
            background-color: #072e33;
            border-bottom: 2px solid #0f969c;
        }

        .navbar-brand {
            color: #fff !important;
            font-weight: bold;
        }

        .nav-link {
            color: #0f969c !important;
            font-weight: bold;
        }

        .nav-link:hover {
            color: #0b5a5e !important;
            text-decoration: underline;
        }

        .navbar-text {
            color: #ccc;
        }

        /* Container styling */
        .container {
            margin-top: 30px;
            max-width: 600px;
            background: #072e33;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: #0f969c;
            margin-bottom: 20px;
        }

        /* Form styling */
        .form-label {
            color: #fff;
        }

        .form-control {
            background: #0f2a30;
            color: #fff;
            border: 1px solid #0b5a5e;
            border-radius: 5px;
        }

        .form-control:focus {
            background: #0f2a30;
            color: #fff;
            border-color: #0f969c;
            outline: none;
            box-shadow: 0 0 5px #0f969c;
        }

        /* Button styling */
        .btn-primary {
            background-color: #0f969c;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0b5a5e;
        }

        .btn-secondary {
            background-color: #ae5b5b;
            border: none;
        }

        .btn-secondary:hover {
            background-color: #751d1d;
        }

        .text-danger {
            color: #dc3545;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Quiz Master</a>
            <div class="collapse navbar-collapse">
            </div>
            <span class="navbar-text">Welcome Admin</span>
        </div>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('adm_dashboard') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('new_quiz') }}">Quiz</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('adm_summary') }}">Summary</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>

                </ul>
            
    </nav>

    <!-- New Quiz Form -->
    <div class="container mt-4">
        <h2 class="text-center">Create a New Quiz</h2>

        <form>
            <div class="mb-3">
                <label for="chapter_id" class="form-label">Chapter ID:</label>
                <input type="text" id="chapter_id" class="form-control" placeholder="Enter Chapter ID">
            </div>

            <div class="mb-3">
                <label for="quiz_date" class="form-label">Date:</label>
                <input type="date" id="quiz_date" class="form-control">
            </div>

            <div class="mb-3">
                <label for="duration" class="form-label">Duration:</label>
                <input type="text" id="duration" class="form-control" placeholder="hh:mm">
            </div>

            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary me-2">Save</button>
                <button type="reset" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </div>

</body>
</html>
