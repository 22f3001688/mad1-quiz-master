<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary Charts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js for graphs -->
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #05161a;
            color: #fff;
        }

        /* Navigation Bar */
        .navbar {
            background: #072e33;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f969c;
        }

        .nav-link {
            color: #0f969c;
            text-decoration: none;
            margin-right: 15px;
            font-weight: bold;
        }

        .nav-link:hover {
            color: #0b5a5e;
            text-decoration: underline;
        }

        .search-box {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 200px;
        }

        .user-welcome {
            margin-left: 15px;
            font-size: 1rem;
            color: #ccc;
        }

        /* Summary Container */
        .summary-container {
            padding: 20px;
            margin: 20px auto;
            max-width: 1200px;
            background: #072e33;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .summary-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }

        /* Charts Container */
        .charts-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }

        .chart-box {
            background: #05161a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }

        .chart-box h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #fff;
        }

        .chart-legend {
            text-align: center;
            margin-bottom: 10px;
        }

        .chart-legend span {
            display: inline-block;
            margin: 0 10px;
            font-size: 0.9rem;
            color: #ccc;
        }

        canvas {
            width: 100%;
            height: 300px;
        }
    </style>
</head>
<body>

    <body>

        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-left">
                <a class="nav-link" href="{{ url_for('user_dashboard') }}">Home</a>
                <a class="nav-link" href="{{ url_for('user_scores') }}">Scores</a>
                <a class="nav-link" href="{{ url_for('user_summary') }}">Summary</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>


            </div>
            <div class="nav-right">
                <input type="text" class="search-box" placeholder="Search">
                <span class="user-welcome">Welcome User</span>
            </div>
        </nav>
    

    <!-- Summary Section -->
    <div class="summary-container">
        <h2>Summary Charts</h2>

        <!-- Charts Container -->
        <div class="charts-container">
            <div class="chart-box">
                <h3>Subject-wise Number of Quizzes</h3>
                <div class="chart-legend">
                    <span class="legend-maths">Maths</span>
                    <span class="legend-physics">Physics</span>
                    <span class="legend-chemistry">Chemistry</span>
                </div>
                <canvas id="subjectChart"></canvas>
            </div>

            <div class="chart-box">
                <h3>Month-wise Number of Quizzes Attempted</h3>
                <div class="chart-legend">
                    <span class="legend-january">January</span>
                    <span class="legend-february">February</span>
                    <span class="legend-march">March</span>
                </div>
                <canvas id="monthChart"></canvas>
            </div>
        </div>
    </div>

    <!-- JavaScript to Render Charts -->
    <script>
        // Subject-wise Quiz Chart
        var ctx1 = document.getElementById('subjectChart').getContext('2d');
        var subjectChart = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: ['Maths', 'Physics', 'Chemistry'],
                datasets: [{
                    label: 'Quizzes',
                    data: [5, 8, 6],  // Dummy data
                    backgroundColor: ['#5DADE2', '#28A745', '#EC7063']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });

        // Month-wise Quiz Chart
        var ctx2 = document.getElementById('monthChart').getContext('2d');
        var monthChart = new Chart(ctx2, {
            type: 'pie',
            data: {
                labels: ['January', 'February', 'March'],
                datasets: [{
                    data: [3, 1, 2],  // Dummy data
                    backgroundColor: ['#EC7063', '#F4D03F', '#85C1E9']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    </script>

</body>
</html>
